; Merged into the project's Engine config (a plugin's Config/<Branch>.ini modifies that branch).
; The Grid cursor trace channel and the tile / piece profiles. Slot 18 -- keep the game's own channels below it.
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel18,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="GridCursor")
+Profiles=(Name="GridTile",CollisionEnabled=QueryOnly,bCanModify=True,ObjectTypeName="WorldStatic",CustomResponses=((Channel="GridCursor",Response=ECR_Block)),HelpMessage="A grid tile: blocks the Grid cursor channel, so the cursor hovers and clicks it")
+Profiles=(Name="GridPiece",CollisionEnabled=QueryOnly,bCanModify=True,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="GridCursor",Response=ECR_Ignore)),HelpMessage="A grid piece: ignores the Grid cursor channel, so the tile under it is hovered")
